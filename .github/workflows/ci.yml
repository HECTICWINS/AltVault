name: Tests

# Runs AltVault's checks on every push and pull request: lint, then the test suite (cookie and
# redirect safety, secrets never logged, encrypted storage, Anti-AFK timing).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          architecture: x64
      - name: Lint
        run: |
          python -m pip install --disable-pip-version-check pyflakes==4.0.3
          python -m pyflakes altvault.py build_release.py tests
      - name: Test
        run: python -m unittest discover -s tests -v
